<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pomodoro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app" data-mode="work" data-state="idle">
  <section class="timer" aria-label="Temporizador">
    <div class="tabs" role="group" aria-label="Modo">
      <button data-m="work">Enfoque</button><button data-m="short">Descanso</button><button data-m="long">Descanso largo</button>
    </div>
    <div class="ring" role="timer">
      <svg viewBox="0 0 280 280" aria-hidden="true"><circle class="trk" cx="140" cy="140" r="130"/><circle class="prg" cx="140" cy="140" r="130"/></svg>
      <div class="read"><div class="time">25:00</div><div class="status">Listo para empezar</div></div>
    </div>
    <div class="ctrl">
      <button class="btn main" id="go">Iniciar</button>
      <button class="btn" id="rst">Reiniciar</button>
      <button class="btn" id="skp">Saltar</button>
    </div>
    <div class="count"><div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div><span>Sesiones completadas: <b id="n">0</b></span></div>
    <p class="note" id="note" aria-live="polite"></p>
    <details class="set">
      <summary>Ajustes</summary>
      <div class="fields">
        <label>Enfoque (min)<input type="number" id="c-work" min="1" max="90"></label>
        <label>Descanso (min)<input type="number" id="c-short" min="1" max="30"></label>
        <label>Largo (min)<input type="number" id="c-long" min="1" max="60"></label>
      </div>
      <button class="btn" id="snd" aria-pressed="true">Sonido al terminar: activado</button>
    </details>
  </section>
  <section class="tasks" aria-label="Tareas de la sesión">
    <h2>Tareas de la sesión</h2>
    <p class="hint" id="sum"></p>
    <form class="add" id="add">
      <input id="ti" type="text" placeholder="¿Qué vas a trabajar?" maxlength="80" autocomplete="off" aria-label="Nueva tarea">
      <button class="btn main" style="min-width:0;padding:10px 18px">Añadir</button>
    </form>
    <ul id="list"></ul>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
